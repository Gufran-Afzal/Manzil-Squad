# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# Full guide: docs/DEPLOYMENT.md
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v6

      # The site has no runtime dependencies, so there is no `npm ci` step.
      - name: Unit tests (WhatsApp links, Apps Script logic)
        run: |
          node scripts/test-whatsapp.mjs
          node scripts/test-apps-script.mjs

      # SITE_URL is only used when content/site.json → siteUrl is empty.
      # configure-pages provides the right URL for a project site
      # (https://<user>.github.io/<repo>) or a custom domain.
      - name: Build (validates content and checks every internal link)
        run: node build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
